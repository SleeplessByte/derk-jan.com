[build]
  command = "pnpm build"
  publish = "dist"

[dev]
  command = "pnpm dev"
  port = 4321

# Redirect old path structure to new article structure
[[redirects]]
  from = "/2020/*"
  to = "/articles/2020/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/2021/*"
  to = "/articles/2021/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/here-we-go-again"
  to = "/articles/here-we-go-again"
  status = 301
  force = true

# Netlify doesn't support 307, and for a page load both behave the same.
[[redirects]]
  from = "/events/2026-gay-cafe/"
  to = "/events/2026-gay-cafe/nl/"
  status = 302
  conditions = {Language = ["nl"]}

[[redirects]]
  from = "/events/2026-gay-cafe/"
  to = "/events/2026-gay-cafe/en/"
  status = 302

[[redirects]]
  from = "/cafe"
  to = "/events/2026-gay-cafe/"
  status = 302

[[redirects]]
  from = "/events/2026-gay-cafe/success"
  to = "/events/2026-gay-cafe/en/success"
  status = 301

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
  force = true

# Try out combined site
[[redirects]]
  from = "https://talks.derk-jan.com/"
  to = "https://www.derk-jan.com/talks/"
  status = 302
  force = true

[[redirects]]
  from = "https://talks.derk-jan.com/*"
  to = "https://www.derk-jan.com/:splat"
  status = 302
  force = true

[[redirects]]
  from = "https://talks.derk-jan.com"
  to = "https://www.derk-jan.com/talks/"
  status = 302
  force = true

[[headers]]
  for = "/_astro/*"
  [headers.values]
    "Cache-Control" = "public, max-age=31536000, s-maxage=31536000"
